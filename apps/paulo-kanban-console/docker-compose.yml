version: "3.7"

services:
  web:
    build: ./web
    image: paulohpps/kanban-console-web:1.0.0
    restart: on-failure
    ports:
      - "8123:3000"
    environment:
      # vazio = front usa caminhos relativos /api (proxied pelo Next ate api:3001)
      NEXT_PUBLIC_API_URL: ""
      PORT: 3000

  api:
    build: ./api
    image: paulohpps/kanban-console-api:1.0.0
    restart: on-failure
    environment:
      DATA_DIR: /data
      ASPNETCORE_URLS: http://+:3001
    volumes:
      # dados do Hermes Agent (Kanban + logs)
      - ${HERMES_DATA_DIR:-/home/umbrel/umbrel/app-data/hermes-agent/data/hermes}:/data
